function formatJava(code) {
 const lines = [];
 let line = "", indent = 0, parens = 0, quote = "", escaped = false;
 const flush = () => {
  const value = line.trim();
  if (value) lines.push("  ".repeat(indent) + value);
  line = "";
 };
 for (let i = 0; i < code.length; i++) {
  const ch = code[i];
  if (quote) {
   line += ch;
   if (escaped) escaped = false;
   else if (ch === "\\") escaped = true;
   else if (ch === quote) quote = "";
   continue;
  }
  if (ch === "\"" || ch === "'") { quote = ch; line += ch; continue; }
  if (ch === "(") parens++;
  else if (ch === ")") parens = Math.max(0, parens - 1);
  if (ch === "{") { line = line.trimEnd() + " {"; flush(); indent++; continue; }
  if (ch === "}") {
   flush();
   indent = Math.max(0, indent - 1);
   line = "}";
   let j = i + 1;
   while (j < code.length && /\s/.test(code[j])) j++;
   if (/^(catch|finally|else)\b/.test(code.slice(j))) { line += " "; i = j - 1; }
   else if (code[j] === ";") { line += ";"; i = j; flush(); }
   else if (code[j] === ")" || code[j] === ",") { line += code[j]; i = j; }
   else flush();
   continue;
  }
  if (ch === ";" && parens === 0) { line = line.trimEnd() + ";"; flush(); continue; }
  if (/\s/.test(ch)) { if (line && !line.endsWith(" ")) line += " "; continue; }
  line += ch;
 }
 flush();
 return lines.join("\n");
}
